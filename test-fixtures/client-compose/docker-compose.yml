services:
  iris:
    image: containers.intersystems.com/intersystems/iris-community:latest-cd
    command: ["-a", "sh /setup/setup.sh"]
    ports:
      - "52799:52773"
      - "1999:1972"
    volumes:
      - ./setup:/setup:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ci-setup-done"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
